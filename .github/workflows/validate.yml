name: Validate iOS
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      simulator:
        description: Simulator destination (empty selects an available iPhone)
        required: false
        default: ''
permissions:
  contents: read
concurrency:
  group: ios-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  simulator:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - name: Record toolchain and generate project
        run: |
          xcodebuild -version
          xcodegen --version
          ./scripts/generate_xcode_project.sh
      - name: Select installed simulator
        env:
          REQUESTED_DESTINATION: ${{ inputs.simulator }}
        run: |
          if [ -n "$REQUESTED_DESTINATION" ]; then
            echo "SIMULATOR=$REQUESTED_DESTINATION" >> "$GITHUB_ENV"
          else
            xcrun simctl list devices available -j > "$RUNNER_TEMP/simulators.json"
            python3 - <<'PY'
          import json, os
          with open(os.path.join(os.environ['RUNNER_TEMP'], 'simulators.json')) as stream:
              devices = json.load(stream)['devices']
          phones = [d for runtime in sorted(devices, reverse=True) if '.iOS-' in runtime
                    for d in devices[runtime] if d.get('isAvailable') and d['name'].startswith('iPhone')]
          if not phones:
              raise SystemExit('No available iPhone simulator')
          with open(os.environ['GITHUB_ENV'], 'a') as stream:
              stream.write('SIMULATOR=platform=iOS Simulator,id=' + phones[0]['udid'] + '\n')
          print('Selected:', phones[0]['name'])
          PY
          fi
      - name: Test without Mozc device artifacts
        run: xcodebuild test -project MozcFlickKeyboard.xcodeproj -scheme MozcFlickKeyboard -destination "$SIMULATOR" -resultBundlePath TestResults CODE_SIGNING_ALLOWED=NO
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-test-results
          path: TestResults.xcresult
          if-no-files-found: ignore
